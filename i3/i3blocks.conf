# i3blocks config file changed for EndeavourOS-i3 setup
# Modernized, Arc Dark-Themed, with clear text separators

# ==============================================================================
# GLOBAL PROPERTIES
# ==============================================================================
separator=false
markup=pango
# Default text color (Arc grey-white)
color=#a6adc8 

# ==============================================================================
# APPLICATION SHORTCUTS
# ==============================================================================
[terminal]
full_text= 
color=#89b4fa 
command=i3-msg -q exec xfce4-terminal

[browser]
full_text= 󰈹
color=#f38ba8 
command=i3-msg -q exec librewolf

[files]
full_text= 󰉋
color=#a6e3a1 
command=i3-msg -q exec thunar ~/

[sep1]
full_text=  |  
color=#89b4fa

# ==============================================================================
# SYSTEM RESOURCES (Disk, Memory, CPU)
# ==============================================================================
[disk]
label=󰋊 
instance=/
command=~/.config/i3/scripts/disk
interval=30

[memory]
label=  
command=~/.config/i3/scripts/memory
interval=2

[cpu_usage]
label=  
command=~/.config/i3/scripts/cpu_usage
interval=2

[CPU-temperature]
label=󰏗 
command=~/.config/i3/scripts/temperature
interval=30

[sep2]
full_text=  |  
color=#89b4fa

# ==============================================================================
# NETWORK & WEATHER
# ==============================================================================
[bandwidth]
command=~/.config/i3/scripts/bandwidth2
interval=persist

[Weather]
command=~/.config/i3/scripts/openweather
interval=1800
color=#89b4fa

[sep3]
full_text=  |  
color=#89b4fa

# ==============================================================================
# POWER MANAGEMENT
# ==============================================================================
[ppd_menu]
full_text=󰌢
command=~/.config/i3/scripts/power-profiles
color=#f9e2af 

[ppd-status]
command=~/.config/i3/scripts/ppd-status
interval=5

[sep4]
full_text=  |  
color=#89b4fa

# ==============================================================================
# KEYBOARD, AUDIO & USB MANAGEMENT
# ==============================================================================
[keybindings]
full_text=󰌌 
command=~/.config/i3/scripts/keyhint

[volume]
command=if [ "$BLOCK_BUTTON" = "1" ]; then pavucontrol & fi; ~/.config/i3/scripts/volume
interval=2

[usb-manager]
command=~/.config/i3/scripts/usb-manager
interval=3
signal=11

[sep5]
full_text=  |  
color=#89b4fa

# ==============================================================================
# DATE, TIME & SESSION
# ==============================================================================
[time]
command=date '+%a %d %b %H:%M' 
interval=60 
color=#cdd6f4

[shutdown_menu]
full_text=     
command=~/.config/i3/scripts/powermenu
color=#f38ba8